[tool.poetry]
name = "neural-renderer"
version = "0.1.0"
description = "Neural Phong renderer (Projekt 3)"
authors = ["Dawid Budzyński", "Filip Budzyński"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
numpy = "^2.0.0"
torch = "^2.0.0"
tqdm = "^4.65.0"
pillow = "^10.0.0"
scipy = "^1.10.0"
scikit-image = "^0.21.0"
opencv-python-headless = "^4.8.0"
moderngl = "^5.12.0"
PyWavefront = "^1.3.3"
pyrr = "^0.10.3"
lpips = "*"
flip-evaluator = "^1.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
